name: Frontend

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      - "docs/product/tinlyt-frontend-*.md"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      - "docs/product/tinlyt-frontend-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked workspace dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate workspace manifest
        working-directory: apps/web
        run: node -e "const p=require('./package.json'); if(p.name!=='@tinlyt/web') process.exit(1)"
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: JavaScript syntax check
        working-directory: apps/web
        run: npm run syntax-check
      - name: TypeScript typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Static security checks
        working-directory: apps/web
        run: npm run security
      - name: Tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Production artifact HTTP smoke check
        working-directory: apps/web
        run: npm run release-check
      - name: Install pinned Playwright browser test runner
        run: python -m pip install --disable-pip-version-check --no-input playwright==1.64.0
      - name: Install Chromium for accessibility and responsive tests
        run: python -m playwright install --with-deps chromium
      - name: Browser accessibility, keyboard, contrast and responsive tests
        run: python tests/frontend_browser_accessibility.py
