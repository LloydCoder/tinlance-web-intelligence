name: Release readiness

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: twi_test
          POSTGRES_USER: twi
          POSTGRES_PASSWORD: twi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twi -d twi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TWI_TEST_POSTGRES_DSN: postgresql://twi:twi-ci-password@localhost:5432/twi_test?sslmode=disable
      TWI_POSTGRES_PASSWORD: release-check-only-url-safe-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned toolchain and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip install cyclonedx-bom==7.5.0
      - name: Run quality, type, security, dependency, and database tests
        run: |
          ruff check .
          mypy src tests
          bandit -q -r src apps
          pytest -q
          python scripts/check_migration_sync.py
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - name: Validate Compose deployment
        run: docker compose -f deployments/compose/development.yml config --quiet
      - name: Build release artifacts
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/verify_release.py
          python -m pip check
      - name: Generate CycloneDX build-environment SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at || github.run_id }}
        run: |
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON --output-file dist/twi-build-environment.cdx.json --output-reproducible
          python -m json.tool dist/twi-build-environment.cdx.json > /dev/null
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Upload release artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twi-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
