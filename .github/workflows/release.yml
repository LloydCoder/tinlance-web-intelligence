name: Release readiness

on:
  push:
    branches: ["work/w7-attestation-verification"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: twi_test
          POSTGRES_USER: twi
          POSTGRES_PASSWORD: twi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twi -d twi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TWI_TEST_POSTGRES_DSN: postgresql://twi:twi-ci-password@localhost:5432/twi_test?sslmode=disable
      TWI_POSTGRES_PASSWORD: release-check-only-url-safe-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned toolchain and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1
          python -m pip install cyclonedx-bom==7.5.0
          python -m pip check
          mkdir -p dist
      - name: Audit release dependency environment
        run: pip-audit --strict --progress-spinner off --format json --output dist/pip-audit.json -r requirements-dev.txt
      - name: Run quality, type, security, dependency, and database tests
        run: |
          ruff check .
          mypy src tests
          bandit -q -r src apps
          pytest -q
          python scripts/check_migration_sync.py
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - name: Validate Compose deployment
        run: docker compose -f deployments/compose/development.yml config --quiet
      - name: Build twice from clean source archives and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p "$RUNNER_TEMP/twi-source-1" "$RUNNER_TEMP/twi-source-2"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-1"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-2"
          (
            cd "$RUNNER_TEMP/twi-source-1"
            python -m build --outdir "$RUNNER_TEMP/twi-build-1"
          )
          (
            cd "$RUNNER_TEMP/twi-source-2"
            python -m build --outdir "$RUNNER_TEMP/twi-build-2"
          )
          for archive in "$RUNNER_TEMP"/twi-build-1/*.tar.gz "$RUNNER_TEMP"/twi-build-2/*.tar.gz; do
            python scripts/normalize_sdist.py "$archive" "$SOURCE_DATE_EPOCH"
          done
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          first = root / "twi-build-1"
          second = root / "twi-build-2"
          names1 = sorted(path.name for path in first.iterdir() if path.is_file())
          names2 = sorted(path.name for path in second.iterdir() if path.is_file())
          if not names1 or names1 != names2:
              raise SystemExit("reproducible build artifact sets differ")
          for name in names1:
              digest1 = hashlib.sha256((first / name).read_bytes()).hexdigest()
              digest2 = hashlib.sha256((second / name).read_bytes()).hexdigest()
              if digest1 != digest2:
                  print(f"non-reproducible artifact: {name}", file=sys.stderr)
                  raise SystemExit(1)
          print(f"reproducibility verified for {len(names1)} artifacts")
          PY
          mkdir -p dist
          cp "$RUNNER_TEMP"/twi-build-1/* dist/
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/verify_release.py
          python -m pip check
      - name: Generate CycloneDX build-environment SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON --output-file dist/twi-build-environment.cdx.json --output-reproducible
          python -m json.tool dist/twi-build-environment.cdx.json > /dev/null
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json pip-audit.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - name: Independently verify release artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts available for attestation verification" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            [[ -f "$artifact" ]] || continue
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one wheel for the negative provenance test" >&2
            exit 1
          fi
          tampered="$RUNNER_TEMP/twi-tampered.whl"
          cp "${wheels[0]}" "$tampered"
          printf '\nTWI tamper-detection test\n' >> "$tampered"
          if gh attestation verify "$tampered" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"; then
            echo "Tampered artifact unexpectedly passed provenance verification" >&2
            exit 1
          fi
          echo "Tampered artifact correctly rejected"
      - name: Upload release artifacts and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twi-release-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30
