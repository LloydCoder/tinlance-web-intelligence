name: Release readiness

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: twi_test
          POSTGRES_USER: twi
          POSTGRES_PASSWORD: twi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twi -d twi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TWI_TEST_POSTGRES_DSN: postgresql://twi:twi-ci-password@localhost:5432/twi_test?sslmode=disable
      TWI_POSTGRES_PASSWORD: release-check-only-url-safe-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned toolchain
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip install build==1.3.0
      - name: Run quality, type, security, and database tests
        run: |
          ruff check .
          mypy src tests
          bandit -q -r src apps
          pytest -q
          python scripts/check_migration_sync.py
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - name: Validate Compose deployment
        run: docker compose -f deployments/compose/development.yml config --quiet
      - name: Build release artifacts
        run: python -m build
      - name: Verify built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/verify_release.py
