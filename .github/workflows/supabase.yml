name: Supabase database tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/web/api/early-access.js"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/web/api/early-access.js"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.84.2
      - name: Show pinned CLI version
        run: supabase --version
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply migrations and run pgTAP security tests
        run: supabase test db
