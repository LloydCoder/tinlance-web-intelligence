name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: twi_test
          POSTGRES_USER: twi
          POSTGRES_PASSWORD: twi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twi -d twi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TWI_TEST_POSTGRES_DSN: postgresql://twi:twi-ci-password@localhost:5432/twi_test?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1
          python -m pip check
      - name: Verify installed dependency metadata
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Security lint
        run: bandit -q -r src apps
      - name: Audit installed Python dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pip-audit --strict --progress-spinner off --format json --output pip-audit.json -r requirements-dev.txt > pip-audit-output.log 2>&1; then
              cat pip-audit-output.log
              exit 0
            else
              status=$?
            fi
            cat pip-audit-output.log
            if grep -Eqi 'ConnectionResetError|ChunkedEncodingError|ReadTimeout|ConnectTimeout|Temporary failure in name resolution|RemoteDisconnected|Max retries exceeded|Connection broken' pip-audit-output.log && [ "$attempt" -lt 3 ]; then
              echo "Transient package-index/network error during pip-audit (attempt $attempt/3); retrying."
              sleep $((attempt * 5))
              continue
            fi
            exit "$status"
          done
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-${{ github.sha }}-py${{ matrix.python-version }}
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Install Chromium for isolated browser smoke test
        run: python -m playwright install --with-deps chromium
      - name: Unit, contract, and PostgreSQL integration tests
        run: |
          pytest -q
          python scripts/check_migration_sync.py
          python scripts/validate_consumer_contracts.py --matrix contracts/consumer-matrix.json
          python scripts/build_w15_evidence_pack.py --gates docs/readiness/w15-gates.json --output dist/w15-evidence-pack.json
          python scripts/validate_w15_evidence_pack.py --pack dist/w15-evidence-pack.json --revision "$(git rev-parse HEAD)"
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh scripts/ci_postgres_restore_drill.sh
      - name: PostgreSQL dump and restore round-trip drill
        env:
          TWI_TEST_POSTGRES_PASSWORD: twi-ci-password
        run: bash scripts/ci_postgres_restore_drill.sh
      - name: Upload source-bound W15 readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w15-evidence-${{ github.sha }}-py${{ matrix.python-version }}
          path: dist/w15-evidence-pack.json
          if-no-files-found: warn
          retention-days: 30
      - name: Configure runner user-namespace sandbox prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Chromium runtime smoke test
        env:
          TWI_RUN_BROWSER_INTEGRATION: "1"
        run: pytest -q tests/test_browser_runtime.py

  browser-isolation:
    name: Browser container isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWI_BROWSER_PROXY_USERNAME: browser-worker
      TWI_BROWSER_PROXY_PASSWORD: ci-only-browser-proxy-secret-2026
      TWI_BROWSER_BROKER_TOKEN: ci-only-browser-broker-token-placeholder-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production-like staging Compose topology
        env:
          TWI_DATABASE_URL: postgresql://twi_runtime:ci-runtime-password@db.example/twi?sslmode=verify-full
          TWI_MIGRATION_DATABASE_URL: postgresql://twi_migrator:ci-migration-password@db.example/twi?sslmode=verify-full
          TWI_IDENTITY_ISSUER: https://platform.example.test
          TWI_IDENTITY_AUDIENCE: tinlance-web-intelligence
          TWI_IDENTITY_JWKS_URL: https://platform.example.test/.well-known/jwks.json
          TWI_BROWSER_BROKER_TOKEN: ci-only-browser-broker-token-placeholder-2026
          TWI_BROWSER_PROXY_USERNAME: browser-worker
          TWI_BROWSER_PROXY_PASSWORD: ci-only-browser-proxy-secret-2026
          TWI_WORLD_INTELLIGENCE_URL: https://world-intelligence.example.test
          TWI_WORLD_INTELLIGENCE_TOKEN: ci-only-world-intelligence-token-placeholder-2026
        run: docker compose -f deployments/compose/staging.yml config --quiet
      - name: Validate isolated Compose topology
        run: docker compose -f deployments/compose/browser-isolated.yml config --quiet
      - name: Build all isolated service images
        id: build_isolated_images
        run: docker compose -f deployments/compose/browser-isolated.yml build --parallel
      - name: Prepare container scan evidence directory
        run: mkdir -p trivy-results
      - name: Scan API image for high and critical vulnerabilities
        id: trivy_api
        if: ${{ always() && steps.build_isolated_images.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twi-browser-isolation-api:latest
          version: v0.76.0
          format: json
          output: trivy-results/api.json
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan worker image for high and critical vulnerabilities
        id: trivy_worker
        if: ${{ always() && steps.build_isolated_images.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twi-browser-isolation-worker:latest
          version: v0.76.0
          format: json
          output: trivy-results/worker.json
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan browser worker image for high and critical vulnerabilities
        id: trivy_browser_worker
        if: ${{ always() && steps.build_isolated_images.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twi-browser-isolation-browser-worker:latest
          version: v0.76.0
          format: json
          output: trivy-results/browser-worker.json
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan egress proxy image for high and critical vulnerabilities
        id: trivy_egress_proxy
        if: ${{ always() && steps.build_isolated_images.outcome == 'success' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twi-browser-isolation-egress-proxy:latest
          version: v0.76.0
          format: json
          output: trivy-results/egress-proxy.json
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Start egress proxy
        run: docker compose -f deployments/compose/browser-isolated.yml up -d --wait egress-proxy
      - name: Verify browser network cannot bypass the proxy
        run: |
          docker compose -f deployments/compose/browser-isolated.yml run --rm --no-deps --entrypoint python browser-worker -c '
          import socket
          with socket.create_connection(("egress-proxy", 3128), timeout=3):
              pass
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2)
          except OSError:
              print("direct public egress blocked; proxy path reachable")
          else:
              raise SystemExit("browser worker can reach public Internet without the proxy")
          '
      - name: Configure host user-namespace support for Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Verify Chromium sandbox inside the browser container
        run: |
          docker compose -f deployments/compose/browser-isolated.yml run --rm --no-deps --entrypoint python browser-worker -c '
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True, chromium_sandbox=True)
                  await browser.close()
          asyncio.run(main())
          '
      - name: Enforce actionable container vulnerability policy
        if: ${{ always() && steps.build_isolated_images.outcome == 'success' }}
        env:
          API_SCAN_OUTCOME: ${{ steps.trivy_api.outcome }}
          WORKER_SCAN_OUTCOME: ${{ steps.trivy_worker.outcome }}
          BROWSER_WORKER_SCAN_OUTCOME: ${{ steps.trivy_browser_worker.outcome }}
          EGRESS_PROXY_SCAN_OUTCOME: ${{ steps.trivy_egress_proxy.outcome }}
        run: |
          if [[ "$API_SCAN_OUTCOME" != "success" || "$WORKER_SCAN_OUTCOME" != "success" || "$BROWSER_WORKER_SCAN_OUTCOME" != "success" || "$EGRESS_PROXY_SCAN_OUTCOME" != "success" ]]; then
            echo "A Trivy scan failed to complete. Review uploaded reports; scanner errors are blockers." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import pathlib
          import sys

          report_dir = pathlib.Path("trivy-results")
          reports = sorted(report_dir.glob("*.json"))
          if len(reports) != 4:
              raise SystemExit(f"expected 4 container scan reports, found {len(reports)}")

          actionable = []
          unfixed = []
          for path in reports:
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"invalid Trivy report {path}: {exc}") from exc
              for result in report.get("Results") or []:
                  for vuln in result.get("Vulnerabilities") or []:
                      severity = vuln.get("Severity", "UNKNOWN")
                      if severity not in {"HIGH", "CRITICAL"}:
                          continue
                      finding = (
                          f"{path.name}: {severity} {vuln.get('VulnerabilityID', 'UNKNOWN')} "
                          f"{vuln.get('PkgName', 'unknown')}@{vuln.get('InstalledVersion', 'unknown')}"
                      )
                      if vuln.get("FixedVersion"):
                          actionable.append(f"{finding} fixed in {vuln['FixedVersion']}")
                      else:
                          unfixed.append(finding)

          if actionable:
              print("Actionable HIGH/CRITICAL container vulnerabilities:", file=sys.stderr)
              print("\\n".join(actionable), file=sys.stderr)
              raise SystemExit(1)

          print(f"No fixable HIGH/CRITICAL findings across {len(reports)} images.")
          print(f"Unfixed HIGH/CRITICAL findings retained for explicit security review: {len(unfixed)}.")
          if unfixed:
              print("Unfixed findings are NOT considered cleared; review the uploaded reports and record VEX/risk disposition before staging or release.")
          PY
      - name: Stop isolated stack
        if: always()
        run: docker compose -f deployments/compose/browser-isolated.yml down --volumes
      - name: Upload container vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-container-scan-${{ github.sha }}
          path: trivy-results/*.json
          if-no-files-found: warn
          retention-days: 30


  release-artifacts:
    name: Reproducible release artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip install cyclonedx-bom==7.5.0
          python -m pip check
      - name: Build twice from clean source archives and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p "$RUNNER_TEMP/twi-source-1" "$RUNNER_TEMP/twi-source-2"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-1"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-2"
          (
            cd "$RUNNER_TEMP/twi-source-1"
            python -m build --outdir "$RUNNER_TEMP/twi-build-1"
          )
          (
            cd "$RUNNER_TEMP/twi-source-2"
            python -m build --outdir "$RUNNER_TEMP/twi-build-2"
          )
          for archive in "$RUNNER_TEMP"/twi-build-1/*.tar.gz "$RUNNER_TEMP"/twi-build-2/*.tar.gz; do
            python scripts/normalize_sdist.py "$archive" "$SOURCE_DATE_EPOCH"
          done
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          first = root / "twi-build-1"
          second = root / "twi-build-2"
          names1 = sorted(path.name for path in first.iterdir() if path.is_file())
          names2 = sorted(path.name for path in second.iterdir() if path.is_file())
          if not names1 or names1 != names2:
              raise SystemExit("reproducible build artifact sets differ")
          for name in names1:
              if hashlib.sha256((first / name).read_bytes()).digest() != hashlib.sha256((second / name).read_bytes()).digest():
                  print(f"non-reproducible artifact: {name}", file=sys.stderr)
                  raise SystemExit(1)
          print(f"reproducibility verified for {len(names1)} artifacts")
          PY
          mkdir -p dist
          cp "$RUNNER_TEMP"/twi-build-1/* dist/
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/verify_release.py
          python -m pip check
      - name: Generate and validate build-environment SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON --output-file dist/twi-build-environment.cdx.json --output-reproducible
          python -m json.tool dist/twi-build-environment.cdx.json > /dev/null
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
