name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned project and development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Security lint
        run: bandit -q -r src
      - name: Install Chromium for isolated browser smoke test
        if: matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Unit and contract tests
        run: pytest -q
      - name: Chromium runtime smoke test
        if: matrix.python-version == '3.12'
        run: pytest -q tests/test_browser_runtime.py
