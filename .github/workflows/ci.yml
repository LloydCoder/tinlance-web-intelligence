name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: twi_test
          POSTGRES_USER: twi
          POSTGRES_PASSWORD: twi-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twi -d twi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TWI_TEST_POSTGRES_DSN: postgresql://twi:twi-ci-password@localhost:5432/twi_test?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Verify installed dependency metadata
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Security lint
        run: bandit -q -r src apps
      - name: Install Chromium for isolated browser smoke test
        run: python -m playwright install --with-deps chromium
      - name: Unit, contract, and PostgreSQL integration tests
        run: |
          pytest -q
          python scripts/check_migration_sync.py
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - name: Configure runner user-namespace sandbox prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Chromium runtime smoke test
        env:
          TWI_RUN_BROWSER_INTEGRATION: "1"
        run: pytest -q tests/test_browser_runtime.py

  browser-isolation:
    name: Browser container isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWI_BROWSER_PROXY_USERNAME: browser-worker
      TWI_BROWSER_PROXY_PASSWORD: ci-only-browser-proxy-secret-2026
      TWI_BROWSER_BROKER_TOKEN: ci-only-browser-broker-token-placeholder-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated Compose topology
        run: docker compose -f deployments/compose/browser-isolated.yml config --quiet
      - name: Build all isolated service images
        run: docker compose -f deployments/compose/browser-isolated.yml build --parallel
      - name: Start egress proxy
        run: docker compose -f deployments/compose/browser-isolated.yml up -d --wait egress-proxy
      - name: Verify browser network cannot bypass the proxy
        run: |
          docker compose -f deployments/compose/browser-isolated.yml run --rm --no-deps --entrypoint python browser-worker -c '
          import socket
          with socket.create_connection(("egress-proxy", 3128), timeout=3):
              pass
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2)
          except OSError:
              print("direct public egress blocked; proxy path reachable")
          else:
              raise SystemExit("browser worker can reach public Internet without the proxy")
          '
      - name: Configure host user-namespace support for Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Verify Chromium sandbox inside the browser container
        run: |
          docker compose -f deployments/compose/browser-isolated.yml run --rm --no-deps --entrypoint python browser-worker -c '
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True, chromium_sandbox=True)
                  await browser.close()
          asyncio.run(main())
          '
      - name: Stop isolated stack
        if: always()
        run: docker compose -f deployments/compose/browser-isolated.yml down --volumes


  release-artifacts:
    name: Reproducible release artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m pip install cyclonedx-bom==7.5.0
          python -m pip check
      - name: Build twice from clean source archives and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p "$RUNNER_TEMP/twi-source-1" "$RUNNER_TEMP/twi-source-2"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-1"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twi-source-2"
          (
            cd "$RUNNER_TEMP/twi-source-1"
            python -m build --outdir "$RUNNER_TEMP/twi-build-1"
          )
          (
            cd "$RUNNER_TEMP/twi-source-2"
            python -m build --outdir "$RUNNER_TEMP/twi-build-2"
          )
          for archive in "$RUNNER_TEMP"/twi-build-1/*.tar.gz "$RUNNER_TEMP"/twi-build-2/*.tar.gz; do
            python scripts/normalize_sdist.py "$archive" "$SOURCE_DATE_EPOCH"
          done
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          first = root / "twi-build-1"
          second = root / "twi-build-2"
          names1 = sorted(path.name for path in first.iterdir() if path.is_file())
          names2 = sorted(path.name for path in second.iterdir() if path.is_file())
          if not names1 or names1 != names2:
              raise SystemExit("reproducible build artifact sets differ")
          for name in names1:
              if hashlib.sha256((first / name).read_bytes()).digest() != hashlib.sha256((second / name).read_bytes()).digest():
                  print(f"non-reproducible artifact: {name}", file=sys.stderr)
                  raise SystemExit(1)
          print(f"reproducibility verified for {len(names1)} artifacts")
          PY
          mkdir -p dist
          cp "$RUNNER_TEMP"/twi-build-1/* dist/
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/verify_release.py
          python -m pip check
      - name: Generate and validate build-environment SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cyclonedx-py environment --pyproject pyproject.toml --output-format JSON --output-file dist/twi-build-environment.cdx.json --output-reproducible
          python -m json.tool dist/twi-build-environment.cdx.json > /dev/null
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
