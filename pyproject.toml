[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-web-intelligence"
version = "0.1.0"
description = "Evidence-first web acquisition and intelligence services for the Tinlance ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tinlance Limited" }]
dependencies = [
    "aiohttp==3.14.5",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "PyJWT>=2.15,<3",
    "cryptography==50.0.2",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "psycopg[binary,pool]==3.3.6",
]

[project.optional-dependencies]
integration = [
    "httpx==0.28.1",
]
browser = [
    "httpx==0.28.1",
    "playwright==1.64.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "bandit==1.9.4",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "playwright==1.64.0",
    "jsonschema==4.25.1",
]

[tool.setuptools.package-data]
"tinlance_web_intelligence.persistence.migrations" = ["*.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests"]
