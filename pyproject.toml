[build-system]
requires = ["setuptools==84.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-web-intelligence"
version = "0.1.0"
description = "Evidence-first web acquisition and intelligence services for the Tinlance ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Tinlance Limited" }]
dependencies = ["aiohttp==3.14.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.17.0", "mypy==2.4.0", "bandit==1.9.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.bandit]
exclude_dirs = ["tests"]
